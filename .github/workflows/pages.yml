name: Configuration and web installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build_web.py', 'scripts/build_error_search.py', 'docs/data/error-codes.json', 'ota.json', 'version.json', '.github/workflows/pages.yml']
  release:
    types: [published]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release-deploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the released version from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run bundle
        working-directory: web
      - name: Download released images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import json;print(json.load(open('version.json'))['version'])")
          gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern xtouch-2.8.bin --pattern xtouch-2.8-full.bin --dir release-images
      - run: python scripts/build_web.py --firmware-dir release-images --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
