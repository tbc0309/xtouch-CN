name: Build firmware
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esp32:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python -m pip install platformio==6.1.19 -r scripts/requirements.txt
      - run: python -m platformio run -e esp32dev
      - run: cp -R ../xtouch-bin firmware-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-2432s028r
          path: firmware-artifacts/
          if-no-files-found: error
  waveshare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [s3, p4]
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Build and validate package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r scripts/requirements.txt
          python scripts/embed_portal.py
          python boards/build.py "${{ matrix.board }}"
      - uses: actions/upload-artifact@v4
        with:
          name: waveshare-${{ matrix.board }}
          path: boards/build-${{ matrix.board }}/artifacts/
          if-no-files-found: error
